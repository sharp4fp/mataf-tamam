# CodeQL - סריקת אבטחה ואיכות קוד (GitHub)
# סורק את קוד מתה״פ ותמ״מ (JavaScript/TypeScript), את כלי החיפוש של הספרייה (Python)
# ואת תהליכי העבודה עצמם.
# חבילת השאילתות security-and-quality: פגיעויות אבטחה וגם בעיות איכות קוד.
# הממצאים מופיעים בלשונית Security > Code scanning.

name: CodeQL - אבטחה ואיכות קוד

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'   # כל יום ראשון בבוקר
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: סריקה (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              # ספריות צד שלישי מוקטנות - נבדקות בנפרד מול OSV
              - mataf/site/js/pdf.min.js
              - mataf/site/js/pdf.worker.min.js
              - mataf/site/js/jspdf.umd.min.js
              - mataf/site/js/html2canvas.min.js
              # קורפוס המקורות של הספרייה (טקסט ו-PDF)
              - mataf/knowledge/sources/**/text/**
              - mataf/knowledge/sources/**/*.txt
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
