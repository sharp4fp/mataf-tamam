# ספריות מועתקות של מתה״פ - בדיקה מול מאגר הפגיעויות OSV
# Dependabot לא רואה ספריות שהועתקו ישירות לקוד, ולכן הבדיקה הזו משלימה אותו.
# רשימת הספריות והגרסאות: mataf/site/js/VENDORED.json

name: ספריות מועתקות - בדיקת פגיעויות

on:
  push:
    branches: [main]
    paths:
      # רק כשקובץ ספרייה או הרשימה משתנים (לא בכל שינוי קוד - חיסכון בדקות, 14.11.2026); בנוסף - שבועי
      - 'mataf/site/js/VENDORED.json'
      - 'mataf/site/js/pdf.min.js'
      - 'mataf/site/js/pdf.worker.min.js'
      - 'mataf/site/js/jspdf.umd.min.js'
      - 'mataf/site/js/html2canvas.min.js'
      - '.github/scripts/check-vendored.mjs'
      - '.github/workflows/vendored-libs.yml'
  schedule:
    - cron: '23 3 * * 0'   # כל יום ראשון בבוקר
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: בדיקה מול OSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: כל ספרייה מול OSV
        run: node .github/scripts/check-vendored.mjs mataf/site/js/VENDORED.json
