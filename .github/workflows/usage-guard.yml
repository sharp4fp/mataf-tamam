# שומר מכסת הדקות - פעם ביום (תכנית הייעול 14.11.2026). ראו .github/scripts/usage-guard.mjs.
name: שומר מכסת הדקות

on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  guard:
    name: מונה דקות
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts
      - name: סיכום אתמול ועדכון המונה
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/usage-guard.mjs
