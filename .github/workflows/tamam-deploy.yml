# תמ״מ - שטר מטען דיגיטלי: בנייה, בדיקות ופריסה (Cloudflare Pages)
#
# בבקשת עדכון (pull request, כולל Dependabot): בנייה ובדיקות בלבד, בלי פריסה.
# בכל שמירה שנוגעת בתמ״מ: בנייה מלאה (TypeScript + Vite) ובדיקות הרגרסיה (35)
# בדפדפן מול הבנייה. אם הכול עבר - פריסה אוטומטית של הגרסה הפתוחה לפרויקט
# tamam-waybill (נוצר בהרצה הראשונה). הגרסה הפתוחה מיועדת לשיתוף עם מי שאין
# לו כלי AI (10.11, 12:44 ו-13:02); מה נכלל בה - docs/APPROVALS.md.

name: תמ״מ - בדיקות ופריסה

on:
  push:
    branches: [main]
    paths:
      - 'tamam/**'
      - '.github/workflows/tamam-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tamam/**'
      - '.github/workflows/tamam-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamam-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-test:
    name: בנייה ובדיקות
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamam
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: התקנה
        run: npm install --no-audit --no-fund
      - name: בנייה
        run: npm run build
      - name: דפדפן לבדיקות
        run: npx playwright install --with-deps chromium
      - name: בדיקות רגרסיה
        run: |
          npx vite preview --port 4517 --strictPort >/dev/null 2>&1 &
          sleep 3
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamam-dist
          path: tamam/dist
          retention-days: 1  # מכסת אחסון 500MB במאגר פרטי

  deploy:
    name: פריסה
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tamam-dist
          path: dist
      - name: יצירת הפרויקט אם אינו קיים
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create tamam-waybill --production-branch=main
      - name: העלאה ל-Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tamam-waybill --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: בדיקת עשן
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "נפרס אל: $URL"
          # פרויקט חדש ב-pages.dev יכול לקחת כמה דקות עד שהכתובת עונה
          for i in $(seq 1 18); do
            if curl -sf "$URL/" | grep -q 'שטר מטען'; then echo "הדף עולה"; exit 0; fi
            echo "ממתין לכתובת... ($i)"; sleep 10
          done
          echo "הדף לא עולה"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure() && steps.deploy.outcome == 'success'
        with:
          sparse-checkout: .github/scripts
      - name: חזרה אוטומטית לפריסה הקודמת (בדיקת העשן נכשלה)
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cf-rollback.sh tamam-waybill
